# www → apex (HTTPS)
server {
    listen 443 ssl;
    server_name www.flairy.kr;

    ssl_certificate /etc/letsencrypt/live/flairy.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/flairy.kr/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://flairy.kr$request_uri;
}

# apex 서비스
server {
    listen 443 ssl;
    server_name flairy.kr;

    client_max_body_size 2G;

    ssl_certificate /etc/letsencrypt/live/flairy.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/flairy.kr/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# HTTP → HTTPS apex
server {
    listen 80;
    server_name flairy.kr www.flairy.kr;
    return 301 https://flairy.kr$request_uri;
}
