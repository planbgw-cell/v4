{# 통합 뷰어 하단 컨트롤: 고정 플로팅 푸터 #}
<footer class="h-[100px] fixed bottom-0 w-full z-[100] flex items-center justify-center gap-6 px-6 md:px-8 floating-controls">
  <div class="w-full max-w-xl flex items-center justify-center gap-4">
    {% if mode == 'mypage' %}
    <button type="button" id="btnShare" class="w-48 py-4 rounded-2xl bg-white border border-slate-200 text-slate-700 font-semibold shadow-sm hover:shadow-md transition active:scale-95">
      공유하기
    </button>
    {% if project_type == 'video' and video_url is defined and video_url %}
    <a
      href="/api/v1/projects/{{ project_id }}/download-video"
      download="{{ video_download_filename | default('flairy_highlight.mp4') }}"
      id="btnDownload"
      class="w-48 py-4 rounded-2xl bg-indigo-600 text-white font-semibold shadow-xl shadow-indigo-100 hover:bg-indigo-700 transition active:scale-95 text-center"
    >
      고화질 다운로드
    </a>
    {% elif project_type == 'album' %}
    <a
      href="/api/v1/projects/{{ project_id }}/export-html"
      download="{{ album_download_filename | default('flairy_album.html') }}"
      id="btnDownload"
      class="w-48 py-4 rounded-2xl bg-indigo-600 text-white font-semibold shadow-xl shadow-indigo-100 hover:bg-indigo-700 transition active:scale-95 text-center"
    >
      고화질 다운로드
    </a>
    {% else %}
    <span
      class="w-48 py-4 rounded-2xl bg-white border border-slate-200 text-slate-400 font-semibold shadow-sm cursor-not-allowed text-center"
      title="준비 중"
    >
      고화질 다운로드 (준비중)
    </span>
    {% endif %}
    {% else %}
    <button
      type="button"
      id="btnSave"
      class="w-48 py-4 rounded-2xl bg-white border border-slate-200 text-slate-700 font-semibold shadow-sm hover:shadow-md transition active:scale-95"
    >
      저장하기
    </button>
    <a
      href="/mypage"
      class="w-48 py-4 rounded-2xl bg-indigo-600 text-white font-semibold shadow-xl shadow-indigo-100 hover:bg-indigo-700 transition active:scale-95 text-center"
    >
      내 보관함 관리
    </a>
    {% endif %}
  </div>
</footer>
