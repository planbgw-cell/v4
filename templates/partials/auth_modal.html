{# 인증 모달: 저장 시 비로그인이면 표시. 로그인 패널 / 회원가입 패널 전환. #}
<div id="authModal" class="fixed inset-0 z-50 hidden" aria-hidden="true">
  <div class="fixed inset-0 bg-black/50" id="authModalBackdrop"></div>
  <div class="fixed left-1/2 top-1/2 z-10 w-full max-w-md -translate-x-1/2 -translate-y-1/2 rounded-xl bg-white p-6 shadow-xl">
    <p id="authModalFormError" class="hidden text-sm text-red-600 mb-2"></p>

    {# 패널 1: 로그인 #}
    <div id="authModalLoginPanel">
      <h2 class="mb-4 text-lg font-semibold text-gray-800">로그인하여 저장하기</h2>
      <p class="mb-4 text-sm text-gray-600">로그인하거나 회원가입하면 이 프로젝트가 내 계정에 저장됩니다.</p>

      <form id="authModalLoginForm" class="mb-4 space-y-3">
        <input type="email" id="authModalEmail" placeholder="이메일" required
          class="w-full rounded-lg border border-gray-300 px-3 py-2 text-gray-800 placeholder-gray-400 focus:border-indigo-500 focus:outline-none focus:ring-1 focus:ring-indigo-500" />
        <input type="password" id="authModalPassword" placeholder="비밀번호" required
          class="w-full rounded-lg border border-gray-300 px-3 py-2 text-gray-800 placeholder-gray-400 focus:border-indigo-500 focus:outline-none focus:ring-1 focus:ring-indigo-500" />
        <div class="flex gap-2">
          <button type="submit" form="authModalLoginForm" id="authModalLoginBtn" class="flex-1 rounded-lg bg-indigo-600 px-4 py-2 font-medium text-white hover:bg-indigo-700">
            로그인
          </button>
          <button type="button" id="authModalSignupBtn" class="flex-1 rounded-lg border border-indigo-600 px-4 py-2 font-medium text-indigo-600 hover:bg-indigo-50">
            회원가입
          </button>
        </div>
      </form>

      <div class="mb-4 border-t border-gray-200 pt-4">
        <p class="mb-2 text-xs text-gray-500">소셜 로그인</p>
        <div class="flex flex-col gap-2">
          <a href="/api/auth/google/login?next={{ current_url | default('/', true) }}" id="authModalGoogle" class="flex items-center justify-center gap-2 rounded-lg border border-gray-300 bg-white px-4 py-2 text-gray-700 hover:bg-gray-50">
            Google로 로그인
          </a>
          <a
            href="/api/auth/kakao/login?next={{ current_url | default('/', true) }}"
            id="authModalKakao"
            class="w-full flex items-center justify-center gap-3 rounded-xl bg-[#FEE500] px-4 py-3 font-bold text-black transition-all hover:bg-[#FADA00]"
          >
            <img src="https://developers.kakao.com/assets/img/about/logos/kakaolink/kakaolink_btn_small.png" alt="" class="h-5 w-5" />
            카카오로 로그인
          </a>
        </div>
      </div>

      <button type="button" id="authModalLater" class="w-full rounded-lg border border-gray-300 bg-gray-50 py-2 text-sm font-medium text-gray-600 hover:bg-gray-100">
        나중에 할게요
      </button>
    </div>

    {# 패널 2: 회원가입 #}
    <div id="authModalSignupPanel" class="hidden">
      <div class="mb-4 flex items-center justify-between">
        <button type="button" id="authModalSignupBack" class="flex items-center gap-1 text-sm text-gray-600 hover:text-gray-800">
          <span aria-hidden="true">←</span> 뒤로
        </button>
        <button type="button" id="authModalSignupClose" class="rounded-full p-1 text-gray-500 hover:bg-gray-100 hover:text-gray-700" aria-label="닫기">✕</button>
      </div>
      <h2 class="mb-4 text-lg font-semibold text-gray-800">회원가입</h2>

      <form id="authModalSignupForm" class="mb-4 space-y-3">
        <input type="email" id="authModalSignupEmail" placeholder="이메일" required
          class="w-full rounded-lg border border-gray-300 px-3 py-2 text-gray-800 placeholder-gray-400 focus:border-indigo-500 focus:outline-none focus:ring-1 focus:ring-indigo-500" />
        <input type="password" id="authModalSignupPassword" placeholder="비밀번호" required
          class="w-full rounded-lg border border-gray-300 px-3 py-2 text-gray-800 placeholder-gray-400 focus:border-indigo-500 focus:outline-none focus:ring-1 focus:ring-indigo-500" />
        <input type="password" id="authModalSignupPasswordConfirm" placeholder="비밀번호 확인" required
          class="w-full rounded-lg border border-gray-300 px-3 py-2 text-gray-800 placeholder-gray-400 focus:border-indigo-500 focus:outline-none focus:ring-1 focus:ring-indigo-500" />
        <button type="submit" class="w-full rounded-lg bg-gray-800 px-4 py-2 font-medium text-white hover:bg-gray-900">
          가입하기
        </button>
      </form>

      <p class="mb-4 text-center text-sm text-gray-600">
        <a href="#" id="authModalSignupToLoginLink" class="text-indigo-600 hover:underline">이미 계정이 있으신가요? 로그인</a>
      </p>

      <button type="button" id="authModalSignupLater" class="w-full rounded-lg border border-gray-300 bg-gray-50 py-2 text-sm font-medium text-gray-600 hover:bg-gray-100">
        나중에 할게요
      </button>
    </div>
  </div>
</div>
