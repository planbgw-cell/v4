{# 통합 뷰어 상단 헤더: 랜딩 헤더를 고정 레이아웃으로 재구성 #}
<header class="h-[70px] relative w-full bg-white border-b border-slate-100 flex items-center justify-between px-6 md:px-8">
  <div class="flex items-center gap-2">
    <a href="/" class="text-2xl font-black text-indigo-600 italic tracking-tight">Flairy</a>
    <span class="text-xs text-slate-400 font-medium ml-1 uppercase tracking-[0.2em]">Digital Archive</span>
  </div>
  <div class="flex items-center gap-3">
    {% if current_user %}
    <a href="/mypage" class="px-4 py-2 rounded-full border border-slate-200 bg-white text-sm font-medium text-slate-700 hover:bg-slate-50 transition">
      내 보관함
    </a>
    <a href="/auth/logout" class="px-4 py-2 rounded-full bg-indigo-600 text-sm font-semibold text-white shadow-md shadow-indigo-200 hover:bg-indigo-700 transition">
      로그아웃
    </a>
    {% else %}
    <button
      type="button"
      id="headerAuthBtn"
      class="px-5 py-2 rounded-full bg-indigo-600 text-sm font-semibold text-white shadow-md shadow-indigo-200 hover:bg-indigo-700 transition"
    >
      로그인
    </button>
    {% endif %}
  </div>
</header>
