{# 통합 뷰어 상단 헤더: 랜딩 nav와 동일 #151E3D #}
<header class="h-[70px] relative w-full bg-[#151E3D] border-b border-white/10 flex items-center justify-between px-6 md:px-8">
  {% include "partials/flairy_logo.html" %}
  <div class="flex items-center gap-3">
    {% if current_user %}
    <a href="/mypage" class="px-4 py-2 rounded-full border border-white/15 bg-white/5 text-sm font-medium text-slate-200 hover:bg-white/10 transition">
      내 보관함
    </a>
    <a href="/auth/logout" class="px-4 py-2 rounded-full bg-[#4F46E5] text-sm font-semibold text-white shadow-md hover:bg-[#4338CA] transition">
      로그아웃
    </a>
    {% else %}
    <button
      type="button"
      id="headerAuthBtn"
      class="px-5 py-2 rounded-full bg-[#4F46E5] text-sm font-semibold text-white shadow-md hover:bg-[#4338CA] transition"
    >
      Sign In
    </button>
    {% endif %}
  </div>
</header>
