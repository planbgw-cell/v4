<div id="shareModal" class="fixed inset-0 z-[70] hidden" aria-hidden="true">
  <div id="shareModalBackdrop" class="absolute inset-0 bg-black/45"></div>
  <div class="absolute inset-x-0 bottom-0 md:inset-0 md:flex md:items-center md:justify-center p-4">
    <section class="w-full md:max-w-md rounded-2xl bg-white shadow-2xl border border-slate-200 overflow-hidden">
      <header class="px-5 py-4 border-b border-slate-100 flex items-center justify-between">
        <div>
          <h2 class="text-base font-semibold text-slate-800">공유하기</h2>
          <p id="shareModalTitle" class="text-xs text-slate-500 mt-1 truncate">프로젝트 링크 공유</p>
        </div>
        <button type="button" id="shareModalClose" class="text-slate-500 hover:text-slate-800 text-xl leading-none" aria-label="닫기">×</button>
      </header>
      <div class="px-5 py-4 space-y-4">
        <div class="rounded-xl border border-slate-200 bg-slate-50 p-3">
          <p class="text-xs text-slate-500 mb-1">공유 링크</p>
          <p id="shareModalUrl" class="text-sm text-slate-700 break-all"></p>
        </div>
        <div class="grid grid-cols-3 gap-2">
          <button type="button" id="btnShareKakao" class="px-3 py-3 rounded-xl border border-yellow-300 bg-yellow-300/20 text-[13px] font-semibold text-yellow-800 hover:bg-yellow-300/35 transition-colors">카카오톡</button>
          <button type="button" id="btnShareCopy" class="px-3 py-3 rounded-xl border border-slate-200 bg-white text-[13px] font-semibold text-slate-700 hover:bg-slate-50 transition-colors">링크 복사</button>
          <button type="button" id="btnShareQr" class="px-3 py-3 rounded-xl border border-slate-200 bg-white text-[13px] font-semibold text-slate-700 hover:bg-slate-50 transition-colors">QR 코드</button>
        </div>
        <div id="shareQrWrap" class="hidden border border-slate-200 rounded-xl p-4 bg-slate-50">
          <div class="flex justify-center">
            <canvas id="shareQrCanvas" width="220" height="220"></canvas>
          </div>
        </div>
      </div>
    </section>
  </div>
</div>
<div id="shareToast" class="fixed bottom-6 left-1/2 -translate-x-1/2 z-[80] hidden px-4 py-2 rounded-full bg-slate-900 text-white text-sm shadow-xl">
  링크가 복사되었습니다.
</div>
