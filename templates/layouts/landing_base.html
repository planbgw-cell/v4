<!DOCTYPE html>
<html lang="ko" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="flairy-public-origin" content="{{ public_base_url }}">
  <title>{% block title %}Flairy (플레어리) - AI 하이라이트 영상 및 디지털 앨범 서비스{% endblock %}</title>
  <link rel="icon" href="data:,">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Noto+Serif+KR:wght@300;400;500;600;700;900&family=Inter:wght@300;400;500;600;700&family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'Noto Sans KR', 'sans-serif'],
            serif: ['Playfair Display', 'Noto Serif KR', 'serif'],
          },
          colors: {
            flairy: {
              indigo: '#151E3D',
              indigoLight: '#222D4E',
              indigoSlate: '#313F70',
              coolBg: '#F8FAFC',
              coolBorder: '#E2E8F0',
              accent: '#4F46E5',
              accentHover: '#4338CA',
              accentLight: '#EEF2FF',
              textDark: '#0F172A',
              textMuted: '#64748B',
              gold: '#D4AF37',
            }
          },
          boxShadow: {
            'glow-indigo': '0 10px 30px -5px rgba(79, 70, 229, 0.35)',
            'premium': '0 25px 50px -12px rgba(21, 30, 61, 0.08)',
            'inner-soft': 'inset 0 2px 8px rgba(0, 0, 0, 0.03)',
          },
          animation: {
            'spin-slow': 'spin 20s linear infinite',
            'float': 'float 6s ease-in-out infinite',
          },
          keyframes: {
            float: {
              '0%, 100%': { transform: 'translateY(0)' },
              '50%': { transform: 'translateY(-10px)' },
            }
          }
        }
      }
    };
  </script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="/static/css/internal.css">
  <link rel="stylesheet" href="/static/css/landing.css">
  {% block head %}{% endblock %}
</head>
<body class="flairy-has-fixed-header bg-[#FAFBFD] text-flairy-textDark font-sans selection:bg-flairy-accent/20 selection:text-flairy-accentHover overflow-x-hidden">
  {% include "partials/header.html" %}
  {% block content %}{% endblock %}
  <script>
  (function () {
    if (window.__flairyAnalyticsInit) return;
    window.__flairyAnalyticsInit = true;

    var STORAGE_KEY = "flairy_session_id";
    var COOKIE_KEY = "flairy_analytics_sid";
    var COLLECT_URL = "/api/v1/analytics/collect";
    var STAY_URL = "/api/v1/analytics/stay-time";

    function makeSessionId() {
      if (window.crypto && window.crypto.randomUUID) return window.crypto.randomUUID();
      return "sid-" + Date.now() + "-" + Math.random().toString(16).slice(2, 10);
    }
    function getSessionId() {
      var sid = "";
      try { sid = (window.localStorage.getItem(STORAGE_KEY) || "").trim(); } catch (e) {}
      if (!sid) {
        sid = makeSessionId();
        try { window.localStorage.setItem(STORAGE_KEY, sid); } catch (e2) {}
      }
      document.cookie = COOKIE_KEY + "=" + encodeURIComponent(sid) + "; path=/; max-age=31536000; samesite=lax";
      return sid;
    }
    function getUtm() {
      var p = new URLSearchParams(window.location.search || "");
      return {
        utm_source: p.get("utm_source") || "",
        utm_medium: p.get("utm_medium") || "",
        utm_campaign: p.get("utm_campaign") || "",
        utm_term: p.get("utm_term") || "",
        utm_content: p.get("utm_content") || "",
      };
    }
    function collect(sid) {
      var utm = getUtm();
      var payload = {
        session_id: sid,
        referrer_url: document.referrer || "",
        landing_page: window.location.pathname + window.location.search,
        utm_source: utm.utm_source,
        utm_medium: utm.utm_medium,
        utm_campaign: utm.utm_campaign,
        utm_term: utm.utm_term,
        utm_content: utm.utm_content
      };
      fetch(COLLECT_URL, {
        method: "POST",
        credentials: "include",
        headers: { "Content-Type": "application/json", "X-Flairy-Session-Id": sid },
        body: JSON.stringify(payload),
      }).catch(function () {});
    }

    var sid = getSessionId();
    collect(sid);

    var activeStart = Date.now();
    function flushStay(useBeacon) {
      if (!activeStart) return;
      var now = Date.now();
      var seconds = Math.floor((now - activeStart) / 1000);
      activeStart = 0;
      if (seconds <= 0) return;
      var body = JSON.stringify({ session_id: sid, stay_duration: seconds });
      if (useBeacon && navigator.sendBeacon) {
        var blob = new Blob([body], { type: "application/json" });
        navigator.sendBeacon(STAY_URL, blob);
        return;
      }
      fetch(STAY_URL, {
        method: "POST",
        credentials: "include",
        headers: { "Content-Type": "application/json", "X-Flairy-Session-Id": sid },
        body: body,
        keepalive: true,
      }).catch(function () {});
    }
    function resumeStay() {
      if (!activeStart) activeStart = Date.now();
    }

    document.addEventListener("visibilitychange", function () {
      if (document.visibilityState === "hidden") {
        flushStay(false);
      } else if (document.visibilityState === "visible") {
        resumeStay();
      }
    });
    window.addEventListener("pagehide", function () {
      flushStay(true);
    });
  })();
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
