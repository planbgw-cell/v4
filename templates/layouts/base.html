<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="flairy-public-origin" content="{{ public_base_url }}">
  <title>{% block title %}Flairy{% endblock %}</title>
  <link rel="icon" href="data:,">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Noto+Serif+KR:wght@300;400;500;600;700;900&family=Inter:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'Noto Sans KR', 'sans-serif'],
            serif: ['Playfair Display', 'Noto Serif KR', 'serif'],
          },
          colors: {
            flairy: {
              gold: '#D4AF37',
            },
          },
          screens: {
            xs: '480px',
          },
        },
      },
    };
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/static/css/internal.css">
  <style>
    body { font-family: 'Inter', 'Noto Sans KR', sans-serif; overflow-x: hidden; width: 100%; max-width: 100vw; }
    .flairy-site-header { font-family: 'Inter', 'Noto Sans KR', sans-serif; background-color: #151E3D; color: #fff; }
    @media (max-width: 400px) {
      .flairy-header-nav { column-gap: 0.25rem; }
      .flairy-header-nav a,
      .flairy-header-nav button { padding-left: 0.375rem; padding-right: 0.375rem; }
    }
    /* 뷰어 공통: 하단 버튼 영역 (앨범·영상 통일) */
    .footer-actions {
      max-width: 600px;
      margin: 0 auto;
      display: flex;
      gap: 1.5rem;
      justify-content: center;
      flex-shrink: 0;
    }
    /* 뷰어 하단 버튼: 플로팅 제거, 영상/앨범 바로 아래 문서 흐름 배치 */
    .floating-controls {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 0 4rem 0;
      background: transparent;
      backdrop-filter: none;
      border-top: none;
    }
    .btn-primary-viewer {
      min-width: 12rem;
      padding: 1rem 1.5rem;
      border-radius: 1rem;
      font-weight: 700;
      background: #6366f1;
      color: #fff;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 10px 15px -3px rgba(99, 102, 241, 0.2), 0 4px 6px -2px rgba(99, 102, 241, 0.1);
      border: none;
    }
    .btn-primary-viewer:hover {
      background: #4f46e5;
      transform: scale(1.02);
    }
    .btn-primary-viewer:active {
      transform: scale(0.98);
    }
    .btn-secondary-viewer {
      min-width: 12rem;
      padding: 1rem 1.5rem;
      border-radius: 1rem;
      font-weight: 700;
      background: #fff;
      color: #475569;
      text-align: center;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 2px solid #e2e8f0;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.05);
    }
    .btn-secondary-viewer:hover {
      background: #f8fafc;
      border-color: #cbd5e1;
    }
    .btn-secondary-viewer:active {
      transform: scale(0.98);
    }
  </style>
  {% block head %}{% endblock %}
</head>
<body class="flairy-has-fixed-header {% block body_class %}bg-gray-50 text-gray-800 min-h-screen{% endblock %}">
  {% block site_header %}
    {% include "partials/header.html" %}
  {% endblock %}
  {% block content %}{% endblock %}
  <script>
  (function () {
    if (window.__flairyAnalyticsInit) return;
    window.__flairyAnalyticsInit = true;

    var STORAGE_KEY = "flairy_session_id";
    var COOKIE_KEY = "flairy_analytics_sid";
    var COLLECT_URL = "/api/v1/analytics/collect";
    var STAY_URL = "/api/v1/analytics/stay-time";

    function makeSessionId() {
      if (window.crypto && window.crypto.randomUUID) return window.crypto.randomUUID();
      return "sid-" + Date.now() + "-" + Math.random().toString(16).slice(2, 10);
    }
    function getSessionId() {
      var sid = "";
      try { sid = (window.localStorage.getItem(STORAGE_KEY) || "").trim(); } catch (e) {}
      if (!sid) {
        sid = makeSessionId();
        try { window.localStorage.setItem(STORAGE_KEY, sid); } catch (e2) {}
      }
      document.cookie = COOKIE_KEY + "=" + encodeURIComponent(sid) + "; path=/; max-age=31536000; samesite=lax";
      return sid;
    }
    function getUtm() {
      var p = new URLSearchParams(window.location.search || "");
      return {
        utm_source: p.get("utm_source") || "",
        utm_medium: p.get("utm_medium") || "",
        utm_campaign: p.get("utm_campaign") || "",
        utm_term: p.get("utm_term") || "",
        utm_content: p.get("utm_content") || "",
      };
    }
    function collect(sid) {
      var utm = getUtm();
      var payload = {
        session_id: sid,
        referrer_url: document.referrer || "",
        landing_page: window.location.pathname + window.location.search,
        utm_source: utm.utm_source,
        utm_medium: utm.utm_medium,
        utm_campaign: utm.utm_campaign,
        utm_term: utm.utm_term,
        utm_content: utm.utm_content
      };
      fetch(COLLECT_URL, {
        method: "POST",
        credentials: "include",
        headers: { "Content-Type": "application/json", "X-Flairy-Session-Id": sid },
        body: JSON.stringify(payload),
      }).catch(function () {});
    }

    var sid = getSessionId();
    collect(sid);

    var activeStart = Date.now();
    function flushStay(useBeacon) {
      if (!activeStart) return;
      var now = Date.now();
      var seconds = Math.floor((now - activeStart) / 1000);
      activeStart = 0;
      if (seconds <= 0) return;
      var body = JSON.stringify({ session_id: sid, stay_duration: seconds });
      if (useBeacon && navigator.sendBeacon) {
        var blob = new Blob([body], { type: "application/json" });
        navigator.sendBeacon(STAY_URL, blob);
        return;
      }
      fetch(STAY_URL, {
        method: "POST",
        credentials: "include",
        headers: { "Content-Type": "application/json", "X-Flairy-Session-Id": sid },
        body: body,
        keepalive: true,
      }).catch(function () {});
    }
    function resumeStay() {
      if (!activeStart) activeStart = Date.now();
    }

    document.addEventListener("visibilitychange", function () {
      if (document.visibilityState === "hidden") {
        flushStay(false);
      } else if (document.visibilityState === "visible") {
        resumeStay();
      }
    });
    window.addEventListener("pagehide", function () {
      flushStay(true);
    });
  })();
  </script>
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
