<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Flairy{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; overflow-x: hidden; width: 100%; max-width: 100vw; }
    /* 뷰어 공통: 하단 버튼 영역 (앨범·영상 통일) */
    .footer-actions {
      max-width: 600px;
      margin: 0 auto;
      display: flex;
      gap: 1.5rem;
      justify-content: center;
      flex-shrink: 0;
    }
    /* 뷰어 하단 버튼: 플로팅 제거, 영상/앨범 바로 아래 문서 흐름 배치 */
    .floating-controls {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 0 4rem 0;
      background: transparent;
      backdrop-filter: none;
      border-top: none;
    }
    .btn-primary-viewer {
      min-width: 12rem;
      padding: 1rem 1.5rem;
      border-radius: 1rem;
      font-weight: 700;
      background: #6366f1;
      color: #fff;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 10px 15px -3px rgba(99, 102, 241, 0.2), 0 4px 6px -2px rgba(99, 102, 241, 0.1);
      border: none;
    }
    .btn-primary-viewer:hover {
      background: #4f46e5;
      transform: scale(1.02);
    }
    .btn-primary-viewer:active {
      transform: scale(0.98);
    }
    .btn-secondary-viewer {
      min-width: 12rem;
      padding: 1rem 1.5rem;
      border-radius: 1rem;
      font-weight: 700;
      background: #fff;
      color: #475569;
      text-align: center;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 2px solid #e2e8f0;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.05);
    }
    .btn-secondary-viewer:hover {
      background: #f8fafc;
      border-color: #cbd5e1;
    }
    .btn-secondary-viewer:active {
      transform: scale(0.98);
    }
  </style>
  {% block head %}{% endblock %}
</head>
<body class="{% block body_class %}bg-gray-50 text-gray-800 min-h-screen{% endblock %}">
  {% block content %}{% endblock %}
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
