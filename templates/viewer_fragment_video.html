{# HX-Request 시 반환: base 상속 없이 뷰어 콘텐츠만 (스타일 포함) #}
{% include "partials/_viewer_styles.html" %}
<div class="max-w-md mx-auto px-4 py-6" id="viewerRoot" data-project-id="{{ project_id }}" data-project-type="{{ project_type }}">
  <h1 class="text-lg font-semibold text-gray-800 text-center mb-4 truncate"></h1>
  {% if video_url %}
  <div class="content-video">
    <div class="player-9-16 rounded-xl shadow-xl" id="playerContainer">
      <video class="player-blur" id="blurLayer" src="{{ video_url }}" muted loop playsinline preload="metadata"></video>
      <video class="player-video" id="mainVideo" src="{{ video_url }}" controls playsinline preload="metadata"></video>
    </div>
  </div>
  {% elif project_status == 'FAILED' %}
  <div class="player-9-16 rounded-xl bg-red-50 border border-red-200 flex flex-col items-center justify-center px-4 text-center">
    <p class="text-red-800 font-medium text-sm">영상 생성에 실패했습니다. 잠시 후 다시 시도해 주세요.</p>
    <a href="/" class="mt-3 text-indigo-600 text-sm underline">메인으로</a>
  </div>
  {% else %}
  <div class="player-9-16 rounded-xl bg-gray-200 flex items-center justify-center text-gray-500">영상이 아직 없습니다.</div>
  {% endif %}
  {% include "partials/_viewer_actions.html" %}
</div>
